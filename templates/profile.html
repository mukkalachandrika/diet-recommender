<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Profile — NutriAI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #2d6a4f; --green-light: #e8f5ef; --green-mid: #52b788;
      --text: #1a1a1a; --muted: #6b7280; --border: #e5e7eb; --bg: #f9fafb; --white: #ffffff;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--white); border-bottom: 1px solid var(--border); padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 24px; color: var(--green); }
    .logo span { color: var(--green-mid); }
    a.back { color: var(--muted); text-decoration: none; font-size: 14px; }
    a.back:hover { color: var(--green); }
    main { max-width: 640px; margin: 48px auto; padding: 0 24px 60px; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 30px; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 15px; margin-bottom: 32px; }
    .card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--green); margin: 24px 0 12px; }
    .section-title:first-child { margin-top: 0; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 13px; font-weight: 500; color: var(--muted); }
    input, select, textarea {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--green-mid); background: var(--white); }
    textarea { resize: vertical; min-height: 70px; }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1b4332; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 8px 0 24px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Nutri<span>AI</span></div>
    <a class="back" href="/">← Back to profiles</a>
  </header>
  <main>
    <h1>Create Health Profile</h1>
    <p class="subtitle">Fill in your details to get a personalized AI diet plan.</p>
    <div class="card">
      <form method="POST" action="/profile/new">

        <div class="section-title">Personal Details</div>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Chandrika Mukkala" required/>
        </div>
        <div class="row">
          <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="10" max="100" placeholder="22" required/>
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="" disabled selected>Select</option>
              <option>Female</option>
              <option>Male</option>
              <option>Non-binary</option>
              <option>Prefer not to say</option>
            </select>
          </div>
        </div>

        <hr class="divider"/>
        <div class="section-title">Body Measurements</div>
        <div class="row">
          <div class="field">
            <label for="weight_kg">Weight (kg)</label>
            <input type="number" step="0.1" id="weight_kg" name="weight_kg" placeholder="60.5" required/>
          </div>
          <div class="field">
            <label for="height_cm">Height (cm)</label>
            <input type="number" step="0.1" id="height_cm" name="height_cm" placeholder="165" required/>
          </div>
        </div>

        <hr class="divider"/>
        <div class="section-title">Lifestyle & Goals</div>
        <div class="field">
          <label for="activity">Activity level</label>
          <select id="activity" name="activity" required>
            <option value="" disabled selected>Select</option>
            <option value="Sedentary (little or no exercise)">Sedentary (little or no exercise)</option>
            <option value="Lightly active (1–3 days/week)">Lightly active (1–3 days/week)</option>
            <option value="Moderately active (3–5 days/week)">Moderately active (3–5 days/week)</option>
            <option value="Very active (6–7 days/week)">Very active (6–7 days/week)</option>
            <option value="Extra active (physical job or 2x training)">Extra active (physical job or 2x training)</option>
          </select>
        </div>
        <div class="field">
          <label for="goal">Health goal</label>
          <select id="goal" name="goal" required>
            <option value="" disabled selected>Select</option>
            <option value="Lose weight">Lose weight</option>
            <option value="Maintain weight">Maintain weight</option>
            <option value="Gain muscle">Gain muscle</option>
            <option value="Improve energy levels">Improve energy levels</option>
            <option value="Manage a health condition">Manage a health condition</option>
          </select>
        </div>

        <hr class="divider"/>
        <div class="section-title">Food Preferences (optional)</div>
        <div class="field">
          <label for="allergies">Allergies / intolerances</label>
          <textarea id="allergies" name="allergies" placeholder="e.g. lactose intolerant, nut allergy"></textarea>
        </div>
        <div class="field">
          <label for="preferences">Dietary preferences</label>
          <textarea id="preferences" name="preferences" placeholder="e.g. vegetarian, no spicy food, prefer South Indian cuisine"></textarea>
        </div>

        <button type="submit" class="btn">Save Profile & Get My Diet Plan →</button>
      </form>
    </div>
  </main>
</body>
</html>
